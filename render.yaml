services:
  - type: web
    name: medveda-unified
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_PORT
        value: 8001
      - key: PYTHON_PATH
        value: /usr/bin/python3
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
